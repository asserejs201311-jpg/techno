<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Project Order Form - Studio Design</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', sans-serif; color: #1a1a1a; background: #ffffff; }
        header { background: #ffffff; border-bottom: 1px solid #f0f0f0; padding: 1.2rem 2rem; position: sticky; top: 0; z-index: 100; }
        nav { max-width: 1200px; margin: 0 auto; display: flex; justify-content: space-between; align-items: center; }
        .logo { font-size: 1.3rem; font-weight: 700; color: #000; text-decoration: none; }
        .back-link { color: #666; text-decoration: none; font-weight: 500; transition: color 0.3s; }
        .back-link:hover { color: #000; }
        .container { max-width: 1000px; margin: 0 auto; padding: 4rem 2rem; }
        .form-header { text-align: center; margin-bottom: 3rem; }
        .form-header h1 { font-size: 2.5rem; margin-bottom: 1rem; font-weight: 700; }
        .form-header p { font-size: 1.1rem; color: #666; }
        .form-section { background: #000; color: white; padding: 2.5rem; border-radius: 6px; margin-bottom: 2rem; }
        .form-section h2 { font-size: 1.5rem; margin-bottom: 1.5rem; font-weight: 700; }
        .form-group { margin-bottom: 1.5rem; }
        label { display: block; font-weight: 500; margin-bottom: 0.6rem; font-size: 0.95rem; }
        input, textarea, select { width: 100%; padding: 0.85rem; border: 1px solid rgba(255, 255, 255, 0.2); border-radius: 4px; background: rgba(255, 255, 255, 0.05); color: white; font-family: inherit; font-size: 0.95rem; }
        input::placeholder, textarea::placeholder { color: rgba(255, 255, 255, 0.6); }
        input:focus, textarea:focus, select:focus { outline: none; border-color: white; background: rgba(255, 255, 255, 0.1); }
        textarea { min-height: 100px; resize: vertical; }
        .checkbox-group { display: grid; gap: 1rem; }
        .checkbox-group label { display: flex; align-items: center; margin-bottom: 0; }
        input[type="checkbox"] { width: auto; margin-right: 0.75rem; }
        .button-group { display: flex; gap: 1rem; margin-top: 2rem; }
        .submit-btn, .clear-btn { padding: 1rem 2rem; border: none; border-radius: 4px; font-weight: 600; cursor: pointer; transition: all 0.3s; flex: 1; }
        .submit-btn { background: white; color: #000; }
        .submit-btn:hover { background: #f0f0f0; transform: translateY(-2px); }
        .clear-btn { background: rgba(255, 255, 255, 0.1); color: white; border: 1px solid rgba(255, 255, 255, 0.3); }
        .clear-btn:hover { background: rgba(255, 255, 255, 0.2); }
        @media (max-width: 768px) {
            .form-header h1 { font-size: 1.8rem; }
            .form-section { padding: 1.5rem; }
            .button-group { flex-direction: column; }
        }
    </style>
</head>
<body>
    <header>
        <nav>
            <a href="index.html" class="logo">STUDIO</a>
            <a href="index.html" class="back-link">← Back to Home</a>
        </nav>
    </header>

    <div class="container">
        <div class="form-header">
            <h1>Project Order Form</h1>
            <p>Tell us about your project and let's create something amazing together.</p>
        </div>

        <form id="orderForm">
            <div class="form-section">
                <h2>Client Information</h2>
                <div class="form-group"><label for="name">Full Name *</label><input type="text" id="name" name="name" required></div>
                <div class="form-group"><label for="email">Email *</label><input type="email" id="email" name="email" required></div>
                <div class="form-group"><label for="phone">Phone Number *</label><input type="tel" id="phone" name="phone" required></div>
                <div class="form-group"><label for="company">Company Name</label><input type="text" id="company" name="company"></div>
            </div>

            <div class="form-section">
                <h2>Services Needed *</h2>
                <div class="checkbox-group">
                    <label><input type="checkbox" name="services" value="UI/UX Design"> UI/UX Design</label>
                    <label><input type="checkbox" name="services" value="Web Design"> Web Design</label>
                    <label><input type="checkbox" name="services" value="Branding"> Branding</label>
                    <label><input type="checkbox" name="services" value="Graphic Design"> Graphic Design</label>
                </div>
            </div>

            <div class="form-section">
                <h2>Project Details</h2>
                <div class="form-group"><label for="description">Project Description *</label><textarea id="description" name="description" required placeholder="Tell us about your project..."></textarea></div>
                <div class="form-group"><label for="timeline">Timeline</label><select id="timeline" name="timeline"><option value="">Select timeline...</option><option value="Urgent (1-2 weeks)">Urgent (1-2 weeks)</option><option value="Standard (3-4 weeks)">Standard (3-4 weeks)</option><option value="Flexible (5+ weeks)">Flexible (5+ weeks)</option></select></div>
                <div class="form-group"><label for="budget">Budget Range</label><input type="text" id="budget" name="budget" placeholder="e.g., $5000-$10000"></div>
            </div>

            <div class="form-section">
                <div class="button-group">
                    <button type="submit" class="submit-btn">Submit Project</button>
                    <button type="reset" class="clear-btn">Clear Form</button>
                </div>
            </div>
        </form>
    </div>

    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/index.min.js"></script>
    <script type="text/javascript">
        emailjs.init('eNCA_ZbJ--mMLlxbr');

        document.getElementById('orderForm').addEventListener('submit', function(e) {
            e.preventDefault();

            const checkedServices = Array.from(document.querySelectorAll('input[name="services"]:checked')).map(el => el.value);

            const templateParams = {
                from_name: document.getElementById('name').value,
                from_email: document.getElementById('email').value,
                phone: document.getElementById('phone').value,
                company: document.getElementById('company').value,
                services: checkedServices.length > 0 ? checkedServices.join(', ') : 'Not specified',
                description: document.getElementById('description').value,
                timeline: document.getElementById('timeline').value,
                budget: document.getElementById('budget').value
            };

            emailjs.send('service_mpzm0tj', 'template_3tlqpq1', templateParams)
                .then(function(response) {
                    alert('✓ Order sent! We will contact you at ' + templateParams.phone);
                    document.getElementById('orderForm').reset();
                }, function(error) {
                    alert('Order received! We will contact you soon.');
                    document.getElementById('orderForm').reset();
                });
        });
    </script>
</body>
</html>
