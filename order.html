<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Order Form - STUDIO</title>
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/build/index.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: #ffffff;
            color: #000000;
        }

        header {
            padding: 2rem 3rem;
            border-bottom: 1px solid #f0f0f0;
            display: flex;
            justify-content: space-between;
            align-items: center;
            animation: slideInDown 0.8s ease-out;
        }

        .logo {
            font-size: 1.5rem;
            font-weight: 700;
            letter-spacing: 2px;
        }

        .back-link {
            text-decoration: none;
            color: #000000;
            font-weight: 500;
            transition: opacity 0.3s ease;
        }

        .back-link:hover {
            opacity: 0.6;
        }

        .order-container {
            max-width: 700px;
            margin: 3rem auto;
            padding: 0 2rem;
            animation: fadeInUp 1s ease-out;
        }

        .order-container h1 {
            font-size: 2.5rem;
            margin-bottom: 0.5rem;
            text-align: center;
        }

        .order-container p {
            text-align: center;
            color: #666666;
            margin-bottom: 3rem;
        }

        .form-section {
            margin-bottom: 2.5rem;
        }

        .form-section h2 {
            font-size: 1.2rem;
            margin-bottom: 1.5rem;
            padding-bottom: 0.5rem;
            border-bottom: 2px solid #000000;
        }

        .form-group {
            margin-bottom: 1.5rem;
        }

        .form-group label {
            display: block;
            font-weight: 500;
            margin-bottom: 0.5rem;
            font-size: 0.95rem;
        }

        .form-group input,
        .form-group textarea,
        .form-group select {
            width: 100%;
            padding: 0.8rem;
            border: 1px solid #e0e0e0;
            font-family: inherit;
            font-size: 0.95rem;
            transition: border-color 0.3s ease;
        }

        .form-group input:focus,
        .form-group textarea:focus,
        .form-group select:focus {
            outline: none;
            border-color: #000000;
        }

        .form-group textarea {
            resize: vertical;
            min-height: 120px;
        }

        .checkbox-group {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 1rem;
        }

        .checkbox-item {
            display: flex;
            align-items: center;
        }

        .checkbox-item input[type="checkbox"] {
            width: auto;
            margin-right: 0.5rem;
            cursor: pointer;
        }

        .checkbox-item label {
            margin: 0;
            cursor: pointer;
            font-weight: normal;
        }

        .button-group {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1rem;
            margin-top: 2rem;
        }

        .btn {
            padding: 1rem;
            border: 2px solid #000000;
            font-weight: 600;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .btn-submit {
            background: #000000;
            color: #ffffff;
        }

        .btn-submit:hover {
            background: #ffffff;
            color: #000000;
        }

        .btn-clear {
            background: #ffffff;
            color: #000000;
        }

        .btn-clear:hover {
            background: #f5f5f5;
        }

        /* Animations */
        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes slideInDown {
            from {
                opacity: 0;
                transform: translateY(-30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @media (max-width: 768px) {
            .checkbox-group {
                grid-template-columns: 1fr;
            }

            .button-group {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <header>
        <div class="logo">STUDIO</div>
        <a href="index.html" class="back-link">← Back to Home</a>
    </header>

    <div class="order-container">
        <h1>Project Order Form</h1>
        <p>Tell us about your project and how we can help</p>

        <form id="orderForm">
            <!-- Client Information -->
            <div class="form-section">
                <h2>Client Information</h2>

                <div class="form-group">
                    <label for="name">Full Name *</label>
                    <input type="text" id="name" name="name" required>
                </div>

                <div class="form-group">
                    <label for="email">Email Address *</label>
                    <input type="email" id="email" name="email" required>
                </div>

                <div class="form-group">
                    <label for="phone">Phone Number</label>
                    <input type="tel" id="phone" name="phone">
                </div>

                <div class="form-group">
                    <label for="company">Company Name</label>
                    <input type="text" id="company" name="company">
                </div>
            </div>

            <!-- Services -->
            <div class="form-section">
                <h2>Services Needed</h2>

                <div class="checkbox-group">
                    <div class="checkbox-item">
                        <input type="checkbox" id="uiux" name="services" value="UI/UX Design">
                        <label for="uiux">UI/UX Design</label>
                    </div>

                    <div class="checkbox-item">
                        <input type="checkbox" id="web" name="services" value="Web Design">
                        <label for="web">Web Design</label>
                    </div>

                    <div class="checkbox-item">
                        <input type="checkbox" id="branding" name="services" value="Branding">
                        <label for="branding">Branding</label>
                    </div>

                    <div class="checkbox-item">
                        <input type="checkbox" id="graphic" name="services" value="Graphic Design">
                        <label for="graphic">Graphic Design</label>
                    </div>
                </div>
            </div>

            <!-- Project Details -->
            <div class="form-section">
                <h2>Project Details</h2>

                <div class="form-group">
                    <label for="description">Project Description *</label>
                    <textarea id="description" name="description" required></textarea>
                </div>

                <div class="form-group">
                    <label for="timeline">Preferred Timeline</label>
                    <select id="timeline" name="timeline">
                        <option value="">Select timeline</option>
                        <option value="1-2 weeks">1-2 Weeks</option>
                        <option value="2-4 weeks">2-4 Weeks</option>
                        <option value="1-3 months">1-3 Months</option>
                        <option value="3+ months">3+ Months</option>
                        <option value="Flexible">Flexible</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="budget">Budget Range</label>
                    <select id="budget" name="budget">
                        <option value="">Select budget</option>
                        <option value="$1K - $5K">$1K - $5K</option>
                        <option value="$5K - $10K">$5K - $10K</option>
                        <option value="$10K - $25K">$10K - $25K</option>
                        <option value="$25K+">$25K+</option>
                        <option value="Not Sure">Not Sure</option>
                    </select>
                </div>
            </div>

            <!-- Buttons -->
            <div class="button-group">
                <button type="submit" class="btn btn-submit">Submit Order</button>
                <button type="reset" class="btn btn-clear">Clear Form</button>
            </div>
        </form>
    </div>

    <script>
        emailjs.init('eNCA_ZbJ--mMLlxbr');

        document.getElementById('orderForm').addEventListener('submit', function(event) {
            event.preventDefault();

            // Get selected services
            const serviceCheckboxes = document.querySelectorAll('input[name="services"]:checked');
            const services = Array.from(serviceCheckboxes).map(cb => cb.value).join(', ') || 'Not specified';

            const templateParams = {
                from_name: document.getElementById('name').value,
                from_email: document.getElementById('email').value,
                phone: document.getElementById('phone').value,
                company: document.getElementById('company').value,
                services: services,
                description: document.getElementById('description').value,
                timeline: document.getElementById('timeline').value,
                budget: document.getElementById('budget').value
            };

            emailjs.send('service_mpzm0tj', 'template_1wby2lu', templateParams)
                .then(function(response) {
                    alert('✓ Order submitted successfully! We will review your project and contact you soon.');
                    document.getElementById('orderForm').reset();
                }, function(error) {
                    alert('Error submitting order. Please try again.');
                    console.log('FAILED...', error);
                });
        });
    </script>
</body>
</html>
